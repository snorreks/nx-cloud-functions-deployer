name: Build & Publish

on:
    push:
        branches:
            - master

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        # Required permissions for NPM OIDC authentication
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: latest

            - name: Setup Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'pnpm'
                  # Defining the registry URL is recommended when publishing
                  registry-url: 'https://registry.npmjs.org'

            - name: Install dependencies
              run: pnpm install

            - name: Build
              run: pnpm build

            - name: Publish to npmjs (OIDC)
              working-directory: dist
              # npm publish automatically uses the OIDC token when --provenance is passed
              run: npm publish --access public --provenance
